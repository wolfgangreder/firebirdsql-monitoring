# Example Helm values override
# Copy this file, fill in your values, then:
#   helm upgrade --install firebirdsql-monitoring helm/firebirdsql-monitoring \
#     -f my-values.yaml --namespace <your-namespace> --create-namespace

image:
  tag: "<replace-with-tag>"   # see https://hub.docker.com/r/wolfgangreder/at.or.reder.firebird-monitoring/tags

firebird:
  jdbcUrl: "jdbc:firebird://<replace-with-host>:<replace-with-port>//<replace-with-db-path>"
  user: "<replace-with-db-user>"
  password: "<replace-with-password>"    # use --set firebird.password=... to avoid committing secrets
  monitoringInterval: "30s"
  # Optional: network timeouts (defaults shown)
  soTimeoutMs: 10000
  connectTimeoutSeconds: 5
  sections:                    # set false to disable a collection section
    connections: true
    transactions: true
    statements: true
    io: true
    memory: true
  statistics:
    enabled: true
    interval: "1h"
    soTimeout: "10m"
    connectTimeout: "5s"
  workerThreads: 20

ingress:
  enabled: true
  className: "<replace-with-ingressclass>"   # e.g. nginx, traefik
  hosts:
    - host: "<replace-with-hostname>"
      paths:
        - path: /
          pathType: Prefix
