replicaCount: 1

image:
  repository: wolfgangreder/at.or.reder.firebird-monitoring
  tag: "0.3.2-SNAPSHOT"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: firebirdsql-monitoring.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

firebird:
  jdbcUrl: "jdbc:firebird://<replace-with-host>:<replace-with-port>//<replace-with-db-path>"
  user: "sysdba"
  # password: set via --set firebird.password=... or external Secret
  password: "CHANGEME"
  monitoringInterval: "30s"
  # Network timeouts against hung/stale database connections.
  # Without them a dead connection blocks threads forever.
  soTimeoutMs: 10000            # JDBC socket read timeout (ms)
  connectTimeoutSeconds: 5      # JDBC connect timeout (s)
  # Collection sections (scheduled MON$ queries); set false to disable a section
  sections:
    connections: true
    transactions: true
    statements: true
    io: true
    memory: true
  statistics:
    enabled: true               # full DB statistics via service manager (expensive)
    interval: "1h"
    soTimeout: "10m"            # statistics service socket timeout (gstat output can start slowly)
    connectTimeout: "5s"
  workerThreads: 20             # max blocking worker threads

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

prometheus:
  scrape: true
  path: /q/metrics
  port: "8080"

# Probes never touch the database (a DB outage must not restart or unready the pod);
# database state is exposed as the firebird_up metric. timeoutSeconds must be set explicitly:
# the Kubernetes default of 1s is too tight for a JVM under a CPU limit.
livenessProbe:
  httpGet:
    path: /q/health/live
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /q/health/started
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12
