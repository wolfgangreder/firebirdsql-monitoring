# =============================================================================
# Application
# =============================================================================
quarkus.application.name=firebirdsql-monitoring

# =============================================================================
# Firebird Datasource (Jaybird JDBC)
# Credentials and host can be overridden via environment variables.
# =============================================================================
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.firebirdsql.jdbc.FBDriver
quarkus.datasource.jdbc.url=${FIREBIRD_JDBC_URL:jdbc:firebird://localhost:3050//var/lib/firebird/data/monitoring.fdb}
quarkus.datasource.username=${FIREBIRD_USER:sysdba}
quarkus.datasource.password=${FIREBIRD_PASSWORD:masterkey}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=PT10S
quarkus.datasource.jdbc.idle-removal-interval=PT5M

# =============================================================================
# HTTP Server
# =============================================================================
quarkus.http.port=8080

# =============================================================================
# Micrometer / Prometheus metrics
# Metrics are exposed at /q/metrics (default)
# =============================================================================
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# =============================================================================
# SmallRye Health (Kubernetes probes)
# Liveness:  GET /q/health/live  -> always UP if JVM is running
# Readiness: GET /q/health/ready -> UP only when Firebird DB is reachable
# =============================================================================
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready
quarkus.smallrye-health.startup-path=/q/health/started

# =============================================================================
# Kubernetes manifest generation
# Run: ./gradlew build  ->  build/kubernetes/kubernetes.yml
# =============================================================================
quarkus.kubernetes.namespace=monitoring
quarkus.kubernetes.labels."app.kubernetes.io/name"=firebirdsql-monitoring
quarkus.kubernetes.labels."app.kubernetes.io/component"=monitoring
quarkus.kubernetes.service-type=ClusterIP

quarkus.kubernetes.liveness-probe.http-action-path=/q/health/live
quarkus.kubernetes.liveness-probe.initial-delay=10S
quarkus.kubernetes.liveness-probe.period=30S
quarkus.kubernetes.liveness-probe.failure-threshold=3

quarkus.kubernetes.readiness-probe.http-action-path=/q/health/ready
quarkus.kubernetes.readiness-probe.initial-delay=15S
quarkus.kubernetes.readiness-probe.period=15S
quarkus.kubernetes.readiness-probe.failure-threshold=3

quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.requests.cpu=250m
quarkus.kubernetes.resources.limits.memory=512Mi
quarkus.kubernetes.resources.limits.cpu=500m

# =============================================================================
# Logging
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."at.or.reder".level=DEBUG

# =============================================================================
# Firebird monitoring collection interval
# Can be overridden via environment variable FIREBIRD_MONITORING_INTERVAL
# Per-section switches control scheduled MON$ gauge collection (default: enabled).
# Disabled sections register no gauges; REST endpoints stay available.
# =============================================================================
firebird.monitoring.interval=${FIREBIRD_MONITORING_INTERVAL:30s}
firebird.monitoring.connections.enabled=${FIREBIRD_MONITORING_CONNECTIONS_ENABLED:true}
firebird.monitoring.transactions.enabled=${FIREBIRD_MONITORING_TRANSACTIONS_ENABLED:true}
firebird.monitoring.statements.enabled=${FIREBIRD_MONITORING_STATEMENTS_ENABLED:true}
firebird.monitoring.io.enabled=${FIREBIRD_MONITORING_IO_ENABLED:true}
firebird.monitoring.memory.enabled=${FIREBIRD_MONITORING_MEMORY_ENABLED:true}
# =============================================================================
# Firebird statistics collection interval (FBStatisticsManager \u00e2\u0080\u0094 expensive)
# Reads full table/index statistics; keep at 1h or longer.
# Can be overridden via environment variable FIREBIRD_STATISTICS_INTERVAL
# =============================================================================
firebird.statistics.interval=${FIREBIRD_STATISTICS_INTERVAL:1h}
# Enable/disable scheduled FBStatisticsManager collection; manual collection stays available (default: enabled)
firebird.statistics.enabled=${FIREBIRD_STATISTICS_ENABLED:true}

# =============================================================================
# Container image (build with -Dquarkus.container-image.build=true)
# =============================================================================
quarkus.container-image.registry=docker.io
quarkus.container-image.group=wolfgangreder
quarkus.container-image.name=at.or.reder.firebird-monitoring
quarkus.container-image.tag=${quarkus.application.version:latest}
