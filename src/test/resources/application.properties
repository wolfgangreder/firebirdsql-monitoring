# Test profile – disables the scheduler and datasource connectivity checks
# so that tests run without a real Firebird instance.
quarkus.datasource.devservices.enabled=false
quarkus.datasource.health.enabled=false
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.acquisition-timeout=PT1S

# Disable scheduled metric collection during tests
quarkus.scheduler.enabled=false
